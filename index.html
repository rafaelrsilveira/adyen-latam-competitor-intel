            case 'scotiabank':

        function App() {

              const randomAlert = currentAlerts[randomIndex];

            return [...competitorsDb].sort((a, b) => a.name.localeCompare(b.name));

          const comp2 = competitorsDb.find(c => c.id === selectedSlot2) || competitorsDb[1] || {};
          const comp3 = competitorsDb.find(c => c.id === selectedSlot3) || competitorsDb[2] || {};

          // Competidor Ativo na aba de Resumos/Perfis
          const activeSummaryCompetitor = competitorsDb.find(c => c.id === activeSummaryId) || competitorsDb[0] || {};

          const activeBattleBadge = getBrandColorsAndLogo(activeBattleCompetitor.id);

          // Roteiro Comercial Dinâmico (Pitches Temáticos por Objeção)
          const currentPitch = useMemo(() => {
            if (!activeBattleCompetitor.id) return "";
            
            const isMX = locale === 'MX';
            const name = activeBattleCompetitor.name;

            switch (selectedObjection) {
              case 'comercial':
                return isMX

                  : `"${A(name)} foca em tarifas flat-rate baixas na negociação, mas esconde taxas operacionais de liquidação e o custo severo de clientes legítimos bloqueados por fraudes falsas. Com a transparência do nosso modelo IC++ de adquirência direta na Adyen, aumentamos a sua receita real."`;
              
              case 'omnichannel':
                return isMX
                  ? `"${name} maneja las terminales físicas de manera independiente a su pasarela digital de comercio electrónico, lo que fragmenta tu conciliación. Adyen opera con una plataforma única nativa (Unified Commerce) que conecta cada transacción física y digital bajo el mismo identificador de pago."`
                  : `"${A(name)} exige a contratação de gateways adicionais (como Braspag/MIT) e conciliadoras externas para operar no físico e online. Na Adyen, o Unified Commerce é nativo: um contrato único, um portal de dados integrado e zero trabalho manual."`;

              case 'antifraude':
                return isMX
                  ? `"El motor de riesgo de ${name} tiende a rechazar compras válidas de forma masiva para mitigar contracargos, perjudicando tu conversión. Nuestro módulo RevenueProtect actúa con análisis predictivos basados en IA global para bloquear el fraude real sin causar fricción en tus clientes legítimos."`
                  : `"Para ter proteção na ${name}, você precisa contratar um motor terceirizado como o Cybersource, pagando licenças separadas. A Adyen entrega o RevenueProtect integrado na nossa plataforma de adquirência, analisando em tempo real com dados mundiais."`;

              case 'locais':
                return isMX
                  ? `"${name} depende de redireccionamientos complejos o SDKs pesados para integrar SPEI y OXXO Pay. En Adyen, los métodos de pago alternativos mexicanos más relevantes están integrados directamente dentro de nuestro flujo transparente de checkout para evitar el abandono."`
                  : `"${A(name)} processa Pix e novos formatos de Pix Automático de forma apartada do fluxo das bandeiras de cartão. A Adyen unifica Pix na mesma API, permitindo conciliação em tempo real e de alta disponibilidade na hora da liquidação comercial."`;

              case 'global':
                return isMX
                  ? `"Si buscas expandir tu comercio electrónico fuera de México, ${name} te limitará debido a su enfoque puramente doméstico o requerirá contratos locales adicionales de remesas. Adyen es una red adquirente global directa: procesas de forma local en México y te expandes al mundo con la misma API."`
                  : `"${A(name)} é uma adquirente estritamente nacional. Para expandir a sua marca na LatAm ou Europa, você precisará gerenciar múltiplos adquirentes estrangeiros. Com a Adyen, você vende no Brasil e expande o seu e-commerce globalmente sob a mesma infraestrutura."`;

              default:
                return `"${activeBattleCompetitor.battlecard?.script || ""}"`;

          // Auxiliar de Português para Artigos de Marcas Femininas/Masculinas

            const f = ["Cielo", "Stone", "Rede", "Getnet", "dLocal", "PayU", "Stripe"];

          }

          // Roteador NLP para Processamento de Linguagem Natural Simulado de Propostas
          const handleNlpSubmit = (e) => {
            e.preventDefault();
            if (!proposalText.trim()) return;

            const text = proposalText.toLowerCase();
            let detectedComp = competitorsDb[1]?.name || 'Stripe';
            let detectedField = 'approvalRate';
            let detectedVal = '90%';

            // Analisar correspondência de competidores cadastrados
            for (let c of competitorsDb) {
              if (text.includes(c.name.toLowerCase()) || text.includes(c.id)) {
                detectedComp = c.name;
                break;
              }
            }

            // Analisar correspondência de atributos técnicos de dados
            if (text.includes('taxa') || text.includes('aprovacao') || text.includes('tasa') || text.includes('aprobacion')) {
              detectedField = t.fields.aprovacao;
              // Tentar extrair valor numérico
              const matches = text.match(/\d+([.,]\d+)?/);
              detectedVal = matches ? `${matches[0]}%` : '92.5%';
            } else if (text.includes('omni') || text.includes('unified')) {
              detectedField = t.fields.omni;
              detectedVal = locale === 'BR' ? 'Excelente (Unified Commerce Unificado)' : 'Excelente (Comercio Unificado Completo)';
            } else if (text.includes('antifraude') || text.includes('risco') || text.includes('riesgo')) {
              detectedField = t.fields.antifraude;
              detectedVal = locale === 'BR' ? 'Nativo com Inteligência Artificial' : 'Nativo con Inteligencia Artificial';
            } else if (text.includes('global') || text.includes('footprint') || text.includes('paises')) {
              detectedField = t.fields.global;
              detectedVal = locale === 'BR' ? 'Atuação global com adquirência dedicada' : 'Operación global con adquirencia dedicada';
            } else {
              detectedField = t.fields.modelo;
              detectedVal = 'Interchange++ (IC++)';
            }

            // Exibir a interpretação NLP para validação
            setNlpResult({
              competitor: detectedComp,
              field: detectedField,
              newValue: detectedVal,
              rawText: proposalText
            });
          };

          // Confirmação final da proposta NLP, criando rascunho de curadoria
          const handleConfirmNlpProposal = () => {
            if (!nlpResult) return;

            const newId = nlpResult.competitor.toLowerCase().replace(/\s+/g, '-');
            const newCompetitor = {

              name: `${nlpResult.competitor} (Draft)`,
              type: 'Proposto via NLP',
              pricingModel: 'Sob análise de PMM',
              approvalRate: 88,
              omnichannel: 'Em análise técnica',
              antifraud: 'Em análise técnica',
              pixFeature: 'Em análise técnica',
              globalFootprint: nlpResult.field === t.fields.global ? nlpResult.newValue : 'Sob auditoria',
              devExperience: 70,
              companyOverview: `Atualização sugerida por NLP: "${nlpResult.rawText}"`,
              targetAudience: 'Em revisão',
              weaknesses: 'Em revisão',
              strengths: 'Em revisão',
              partners: 'Em revisão',

              marketCap: 'Em análise',
              newsSnippet: 'Sem notícias homologadas',
              newsSearchUrl: 'https://www.google.com/search?q=' + encodeURIComponent(nlpResult.competitor),
              battlecard: {
                whyWeWin: 'Em análise',
                vulnerabilities: 'Em análise',
                script: 'Em análise'
              }
            };

            setIsModalOpen(false);
            setNlpResult(null);
            setProposalText('');
            
            // Redirecionar para visualização na aba de Curadoria
            setActiveTab('curation');

            setCompetitorsDb(prev => prev.map(c => {
              if (c.id === id) {
                return {
                  ...c,
                  status: 'approved',
                  name: c.name.replace(' (Draft)', ''),
                  verifiedBy: locale === 'BR' ? 'Aprovado por PMM' : 'Aprobado por PMM'
                };
              }
              return c;

          };

          const handleDeleteCompetitor = (id) => {

            if (selectedSlot2 === id) setSelectedSlot2('stripe');

            if (activeBattlecardId === id) setActiveBattlecardId('stripe');

          const handleCopyText = (text) => {
            try {
              navigator.clipboard.writeText(text);
            } catch (err) {
              const textArea = document.createElement("textarea");
              textArea.value = text;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand('copy');
              document.body.removeChild(textArea);

            setShowToastCopied(true);
            setTimeout(() => setShowToastCopied(false), 3000);

          // Geradores de Pesquisa dinâmicos com Google Search (para evitar erros 404)
          const getAlertGoogleSearchUrl = (compName, message) => {
            const query = `${compName} ${message}`;
            return `https://www.google.com/search?q=${encodeURIComponent(query)}`;

            return `https://www.google.com/search?q=${encodeURIComponent(query)}`;

                      >

                          <div className="flex justify-between p-2 border-b border-slate-100">
                            <span className="text-slate-400 font-semibold">{t.nlpDetectedVal}</span>
                            <span className="text-emerald-600 font-bold font-mono">{nlpResult.newValue}</span>
                          </div>
                        </div>

                        <p className="text-[10px] text-slate-400 leading-relaxed">
                          {t.nlpExplanation}
                        </p>

                        <div className="flex justify-end gap-3 pt-2">
                          <button
                            type="button"
                            onClick={() => setNlpResult(null)}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-4 py-2 rounded-lg"
                          >
                            TENTAR OUTRA
                          </button>
                          <button
                            type="button"
                            onClick={handleConfirmNlpProposal}
                            className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-lg"
                          >
                            CONFIRMAR PROPOSTA
                          </button>
                        </div>
                      </div>
                    )}

                  </div>
                </div>
              )}

            </div>
          );
        }

        // Renderização segura do nó raiz da aplicação
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
