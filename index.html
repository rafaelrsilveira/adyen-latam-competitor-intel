                          <span className="p-1.5 rounded-lg bg-blue-50 text-blue-600 border border-blue-100">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1M19 20a2 2 0 002-2V8a2 2 0 00-2-2h-5" />
                            </svg>
                          </span>
                          Radar Geral de Inteligência Corporativa (11 Competidores)
                        </h2>
                        <p className="text-xs text-slate-500 mt-1">Acompanhe valuation, dados de mercado acionário e notícias de campo atualizadas de cada player</p>
                      </div>
                      <span className="text-[10px] bg-white border border-slate-200 text-slate-500 px-3 py-1 rounded-full font-bold">Maio 2026</span>
                    </div>

                    {/* Listagem de Notícias dividida por competidor */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {competitors.map(comp => {
                        const badge = getBrandColorsAndLogo(comp.id);
                        return (
                          <div key={comp.id} className="bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300 transition duration-150 flex flex-col justify-between space-y-4 shadow-sm">
                            <div>
                              {/* Nome e Selo da Marca */}
                              <div className="flex justify-between items-start gap-2 mb-3">
                                <span className={`text-[11px] ${badge.bg} ${badge.text} font-bold px-2.5 py-1 rounded-lg border ${badge.border} flex items-center gap-1.5`}>
                                  {badge.icon}
                                  {comp.name}
                                </span>
                              </div>

                              {/* Valor de Mercado / Capital */}
                              <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 mb-3.5">
                                <span className="text-[9px] uppercase font-bold text-slate-400 block tracking-wider">Estrutura de Capital & Finanças</span>
                                <span className="text-xs font-bold text-slate-800 leading-tight block mt-0.5">
                                  {comp.marketCap || 'Capital Fechado / Não Disponível'}
                                </span>
                              </div>

                              {/* Notícia / Recente */}
                              <div className="space-y-1">
                                <span className="text-[9px] uppercase font-bold text-emerald-600 block tracking-wider">Destaque do Mês (Últimos 30 Dias)</span>
                                <p className="text-xs text-slate-600 leading-relaxed text-justify mt-1">
                                  {comp.newsSnippet || 'Nenhuma atualização de alto relevância foi encontrada ou compartilhada nos últimos 30 dias.'}
                                </p>
                              </div>
                            </div>

                            {/* Botão de Link com Busca Otimizada e Battlecard */}
                            <div className="pt-3 border-t border-slate-100 flex justify-between items-center text-[10px]">
                              {comp.id !== 'adyen' ? (
                                <button
                                  onClick={() => {
                                    setActiveTab('compare');
                                    setActiveBattlecardId(comp.id);
                                  }}
                                  className="text-amber-700 font-extrabold hover:underline"
                                >
                                  Ver Battlecard
                                </button>
                              ) : (
                                <span className="text-slate-400">Referência</span>
                              )}
                              
                              {comp.newsSearchUrl && (
                                <a
                                  href={comp.newsSearchUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="text-slate-600 hover:text-slate-950 font-extrabold flex items-center gap-1 bg-slate-50 hover:bg-slate-100 px-2 py-1 rounded border border-slate-200 transition"
                                >
                                  Pesquisa Direta
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                  </svg>
                                </a>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                  </div>
                )}

                {/* ABA: CURADORIA E CONFIGURAÇÃO DE FONTES */}
                {activeTab === 'curation' && (
                  <div className="space-y-6">
                    
                    {/* Bloco Educacional sobre Curadoria */}
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                      <div className="space-y-2 max-w-2xl">
                        <h2 className="text-base font-bold text-slate-900 flex items-center gap-2">
                          <span className="p-1 rounded bg-emerald-50 text-emerald-600 border border-emerald-100">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                            </svg>
                          </span>
                          Processo de Homologação PMM (Product Marketing)
                        </h2>
                        <p className="text-xs text-slate-505 leading-relaxed text-justify">
                          Para garantir a acurácia dos dados competitivos informados no *Grid de Diagnóstico*, o time comercial pode registrar dados de mercado encontrados no dia a dia. Novos inputs são listados como **Rascunho** e revisados de forma centralizada.
                        </p>
                      </div>

                      <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-1 text-xs text-slate-600">
                        <span className="font-bold text-slate-800">Fluxo de Validação:</span>
                        <ol className="list-decimal list-inside text-slate-550 space-y-1 mt-1 font-mono">
                          <li>Sugestão inserida via botão de proposta.</li>
                          <li>O registro entra em status de "Pendente".</li>
                          <li>A equipa de PMM local valida as fontes e documentações.</li>
                          <li>Após homologado, os dados entram em produção.</li>
                        </ol>
                      </div>
                    </div>

                    {/* TABELA DE ESTADOS DE VERIFICAÇÃO */}
                    <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                      <div className="p-4 border-b border-slate-200 bg-slate-50/50">
                        <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Origem das Informações e Status de Auditoria</h3>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse text-xs text-slate-600">
                          <thead>
                            <tr className="border-b border-slate-200 bg-slate-50 text-slate-500 font-bold">
                              <th className="p-4">Concorrente</th>
                              <th className="p-4">Tipo</th>
                              <th className="p-4">Origem / Fonte dos Dados</th>
                              <th className="p-4">Última Revisão</th>
                              <th className="p-4">Status</th>
                              <th className="p-4 text-right">Ação (Simulação PMM)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {competitors.map(c => {
                              const badge = getBrandColorsAndLogo(c.id);
                              return (
                                <tr key={c.id} className="hover:bg-slate-50/50 transition duration-150">
                                  <td className="p-4 font-bold text-slate-900 flex items-center gap-2">
                                    <div className="shrink-0">{badge.icon}</div>
                                    <span>{c.name}</span>
                                  </td>
                                  <td className="p-4 text-slate-500">{c.type}</td>
                                  <td className="p-4 text-slate-600 italic max-w-xs truncate" title={c.dataSource}>
                                    "{c.dataSource}"
                                  </td>
                                  <td className="p-4 text-slate-500">{c.verifiedBy}</td>
                                  <td className="p-4">
                                    {c.status === 'approved' ? (
                                      <span className="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-emerald-200/60 flex items-center gap-1 w-max">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-3.5 w-3.5 text-emerald-600" viewBox="0 0 20 20" fill="currentColor">
                                          <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                                        </svg>
                                        Homologado
                                      </span>
                                    ) : (
                                      <span className="bg-amber-50 text-amber-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-amber-200 flex items-center gap-1 w-max animate-pulse">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-3.5 w-3.5 text-amber-500" viewBox="0 0 20 20" fill="currentColor">
                                          <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                                        </svg>
                                        Rascunho (Draft)
                                      </span>
                                    )}
                                  </td>
                                  <td className="p-4 text-right">
                                    {c.status === 'pending' ? (
                                      <div className="flex justify-end gap-2">
                                        <button
                                          onClick={() => handleApproveCompetitor(c.id)}
                                          className="bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-[10px] px-2.5 py-1 rounded"
                                          title="Homologar alteração"
                                        >
                                          APROVAR
                                        </button>
                                        <button
                                          onClick={() => handleDeleteCompetitor(c.id)}
                                          className="bg-rose-50 hover:bg-rose-100 text-rose-700 text-[10px] font-bold px-2.5 py-1 rounded border border-rose-200"
                                          title="Rejeitar entrada"
                                        >
                                          EXCLUIR
                                        </button>
                                      </div>
                                    ) : (
                                      <span className="text-slate-400 text-[10px]">Revisado por PMM</span>
                                    )}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}

              </main>

              {/* FOOTER */}
              <footer className="bg-white border-t border-slate-200 py-6 px-6 mt-12 text-xs text-slate-400">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-2">
                    <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="font-semibold text-slate-500">Adyen Brasil - Uso Estritamente Comercial e Interno</span>
                  </div>
                  <div>
                    Plataforma comercial light reestruturada em React e Tailwind CDN.
                  </div>
                </div>
              </footer>

              {/* MODAL PARA PROPOR NOVOS DADOS/CONCORRENTES */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                  <div className="bg-white border border-slate-200 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto text-slate-700">
                    
                    <button
                      onClick={() => setIsModalOpen(false)}
                      className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition duration-150"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>

                    <h3 className="text-base font-bold text-slate-900 mb-2">Sugerir Entrada de Inteligência Competitiva</h3>
                    <p className="text-xs text-slate-500 mb-4">Adicione um novo concorrente ou detalhe encontrado em campo. Novas entradas passam pelo processo de validação por PMM.</p>

                    <form onSubmit={handleAddCompetitor} className="space-y-4 text-xs">
                      
                      {/* Nome do Concorrente */}
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Nome da Plataforma Concorrente *</label>
                        <input
                          type="text"
                          required
                          placeholder="Ex: InfinitePay, PagBank Enterprise, Asaas"
                          value={newCompName}
                          onChange={(e) => setNewCompName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500"
                        />
                      </div>

                      {/* Fonte dos Dados */}
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Origem / Fonte da Informação *</label>
                        <input
                          type="text"
                          required
                          placeholder="Ex: Tabela comercial enviada por lead, Site Oficial da API, etc."
                          value={newCompSource}
                          onChange={(e) => setNewCompSource(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500"
                        />
                      </div>

                      {/* Tipo e Tarifas */}
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 mb-1">Tipo de Operador</label>
                          <select
                            value={newCompType}
                            onChange={(e) => setNewCompType(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-700 focus:outline-none focus:border-emerald-500"
                          >
                            <option value="Nacional">Nacional</option>
                            <option value="Global">Global</option>
                            <option value="Subadquirente">Subadquirente</option>
                            <option value="Gateway Puro">Gateway Puro</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 mb-1">Modelo de Tarifas</label>
                          <select
                            value={newCompPricing}
                            onChange={(e) => setNewCompPricing(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-700 focus:outline-none focus:border-emerald-500"
                          >
                            <option value="MDR Flat">MDR Flat</option>
                            <option value="Interchange++ (IC++)">Interchange++ (IC++)</option>
                            <option value="Mensalidade + Transação">Mensalidade + Transação</option>
                          </select>
                        </div>
                      </div>

                      {/* Conversão Aproximação */}
                      <div>
                        <div className="flex justify-between text-[11px] font-semibold text-slate-600 mb-1">
                          <label>Taxa de Aprovação Estimada</label>
                          <span className="text-emerald-600 font-bold">{newCompApproval}%</span>
                        </div>
                        <input
                          type="range"
                          min="75"
                          max="98"
                          step="1"
                          value={newCompApproval}
                          onChange={(e) => setNewCompApproval(Number(e.target.value))}
                          className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                        />
                      </div>

                      {/* Omnichannel e Antifraude */}
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-800 mb-1">Omnichannel</label>
                          <input
                            type="text"
                            placeholder="Ex: Fragmentado via adquirente físico"
                            value={newCompOmni}
                            onChange={(e) => setNewCompOmni(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-800 mb-1">Antifraude</label>
                          <input
                            type="text"
                            placeholder="Ex: Opcional via CyberSource"
                            value={newCompAntifraud}
                            onChange={(e) => setNewCompAntifraud(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                      </div>

                      {/* Gaps e Forças */}
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Vulnerabilidade técnica</label>
                          <textarea
                            rows={2}
                            placeholder="Ex: Altas taxas de estorno e latência de gateway"
                            value={newCompWeaknesses}
                            onChange={(e) => setNewCompWeaknesses(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500 resize-none"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Força comercial</label>
                          <textarea
                            rows={2}
                            placeholder="Ex: Sem custos iniciais de POS de balcão"
                            value={newCompStrengths}
                            onChange={(e) => setNewCompStrengths(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500 resize-none"
                          />
                        </div>
                      </div>

                      {/* Botões do Modal */}
                      <div className="flex justify-end gap-3 pt-3">
                        <button
                          type="button"
                          onClick={() => setIsModalOpen(false)}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-4 py-2 rounded-lg transition duration-150"
                        >
                          CANCELAR
                        </button>
                        <button
                          type="submit"
                          className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-lg transition duration-150"
                        >
                          SUGERIR E VER NO PAINEL
                        </button>
                      </div>

                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        // Renderização da App no nó raíz
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
