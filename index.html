                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-[9px] font-extrabold tracking-widest text-amber-700 uppercase">{t.labelHowWeWin}</span>
                            <button
                              onClick={() => handleCopyText(currentPitch)}
                              className="p-1 hover:bg-slate-200 rounded text-slate-500 hover:text-slate-800 transition"
                              title={t.btnCopy}
                            >
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2" />
                              </svg>
                            </button>
                          </div>
                          <div className="bg-white p-3.5 rounded-lg border border-slate-200 text-[11px] text-slate-600 font-mono italic leading-relaxed h-40 overflow-y-auto">
                            {currentPitch}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-200 text-[10px] text-slate-500 flex items-center gap-1.5">
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-amber-600 stroke-[2.2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          Linguagem focada em faturamento transacional e ROI técnico.
                        </div>
                      </div>

                    </div>
                  </section>
                )}

                {/* TAB: RADAR DE NOTÍCIAS RECENTES */}
                {activeTab === 'news' && (
                  <div className="space-y-6">
                    
                    {/* Header e Filtros */}
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-base font-bold text-slate-900 flex items-center gap-2">
                          <span className="p-1.5 rounded-lg bg-blue-50 text-blue-600 border border-blue-100">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1M19 20a2 2 0 002-2V8a2 2 0 00-2-2h-5" />
                            </svg>
                          </span>
                          Radar Geral de Inteligência Corporativa
                        </h2>
                        <p className="text-xs text-slate-505 mt-1 font-medium">Acompanhe as atualizações de mercado, lançamentos e regulamentações ordenadas de A a Z.</p>
                      </div>
                      <span className="text-[10px] bg-white border border-slate-200 text-slate-500 px-3 py-1 rounded-full font-bold">Junho 2026</span>
                    </div>

                    {/* Listagem de Notícias */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {sortedCompetitors.map(comp => {
                        const badge = getBrandColorsAndLogo(comp.id);
                        return (
                          <div key={comp.id} className="bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300 transition duration-150 flex flex-col justify-between space-y-4 shadow-sm">
                            <div>
                              <div className="flex justify-between items-start gap-2 mb-3">
                                <span className={`text-[11px] ${badge.bg} ${badge.text} font-bold px-2.5 py-1 rounded-lg border ${badge.border} flex items-center gap-1.5`}>
                                  {badge.icon}
                                  {comp.name}
                                </span>
                              </div>

                              <div className="space-y-1">
                                <span className="text-[9px] uppercase font-bold text-emerald-600 block tracking-wider">Destaque Informativo</span>
                                <p className="text-xs text-slate-650 leading-relaxed text-justify mt-2 text-justify">
                                  {comp.newsSnippet || 'Nenhuma movimentação regulatória ou alteração tarifária significativa foi registrada para este competidor nos últimos 30 dias.'}
                                </p>
                              </div>
                            </div>

                            <div className="pt-3 border-t border-slate-100 flex justify-between items-center text-[10px]">
                              {comp.id !== 'adyen' ? (
                                <button
                                  onClick={() => {
                                    setActiveTab('negotiation');
                                    setActiveBattlecardId(comp.id);
                                  }}
                                  className="text-amber-700 font-extrabold hover:underline text-[11px]"
                                >
                                  {t.btnBattlecard}
                                </button>
                              ) : (
                                <span className="text-slate-400 font-medium">Referência</span>
                              )}
                              
                              <a
                                href={getNewsGoogleSearchUrl(comp.name, comp.newsSnippet || '')}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-slate-600 hover:text-slate-950 font-extrabold flex items-center gap-1 bg-slate-50 hover:bg-slate-100 px-2.5 py-1 rounded border border-slate-200 transition text-[10px]"
                              >
                                {t.btnSearch}
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                              </a>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                  </div>
                )}

              </main>

              {/* MODAL ALERTA INDEPENDENTE (SINO DE NOTIFICAÇÃO DO CABEÇALHO) */}
              {isAlertModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                  <div className="bg-white border border-slate-200 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative text-slate-700 max-h-[90vh] overflow-y-auto">
                    
                    <button
                      onClick={() => setIsAlertModalOpen(false)}
                      className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>

                    <div className="flex items-center gap-2 mb-4 border-b border-slate-100 pb-3">
                      <span className="p-1.5 bg-emerald-50 text-emerald-600 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                      </span>
                      <div>
                        <h3 className="text-base font-bold text-slate-900">{t.alertSystemTitle}</h3>
                        <p className="text-[11px] text-slate-500">{t.alertSystemDesc}</p>
                      </div>
                    </div>

                    <div className="space-y-4">
                      {alertsList.map(a => (
                        <div key={a.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200/60 flex flex-col justify-between space-y-2">
                          <div className="space-y-1">
                            <div className="flex justify-between items-center">
                              <span className="bg-white border border-slate-200 px-2 py-0.5 rounded text-[9px] font-bold text-slate-700">{a.competitor}</span>
                              <span className={`h-2 w-2 rounded-full ${a.type === 'pricing' ? 'bg-rose-500' : 'bg-emerald-500'}`} title={a.type}></span>
                            </div>
                            <p className="text-xs text-slate-700 font-semibold leading-relaxed text-justify">{a.message}</p>
                          </div>
                          <div className="pt-2 border-t border-slate-200/50 text-right">
                            <a
                              href={getAlertGoogleSearchUrl(a.competitor, a.message)}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-[10px] text-emerald-600 hover:underline font-extrabold flex items-center justify-end gap-1"
                            >
                              {t.btnSearch}
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                              </svg>
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* FOOTER */}
              <footer className="bg-white border-t border-slate-200 py-6 px-6 mt-12 text-xs text-slate-400">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-2">
                    <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Adyen Latam - Uso Estritamente Comercial e Interno</span>
                  </div>
                  <div>
                    Projetado de forma unificada e estável para Web e Local (file:/// e GitHub).
                  </div>
                </div>
              </footer>

            </div>
          );
        }

        // Renderização limpa e compatível com React 18 no nó raiz
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
